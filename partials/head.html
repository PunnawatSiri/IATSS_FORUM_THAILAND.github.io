<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        const savedTheme = localStorage.getItem("iatss_theme");
        if (savedTheme === "dark" || (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
        }
    </script>
    <title>IATSS Forum Thailand</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        iatss: { DEFAULT: "#006954", dark: "#004d3d", light: "#e6f0ed", hover: "#005443" },
                        apple: { bg: "#ffffff", darkbg: "#0a0a0c", subtle: "#f5f5f7", darksubtle: "#161618", text: "#1d1d1f", darktext: "#f5f5f7", secondary: "#86868b", darksecondary: "#a1a1a6", border: "#e5e5e7", darkborder: "#2c2c2e" }
                    },
                    fontFamily: { sans: ["-apple-system", "BlinkMacSystemFont", "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", "sans-serif"] }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="assets/css/site.css">
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
