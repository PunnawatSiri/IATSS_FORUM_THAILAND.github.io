<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        const savedTheme = localStorage.getItem("iatss_theme");
        if (savedTheme === "dark" || (!savedTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
        }
    </script>
    <title>Alumni | IATSS Forum Thailand</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        iatss: { DEFAULT: "#006954", dark: "#004d3d", light: "#e6f0ed", hover: "#005443" },
                        apple: { bg: "#ffffff", darkbg: "#0a0a0c", subtle: "#f5f5f7", darksubtle: "#161618", text: "#1d1d1f", darktext: "#f5f5f7", secondary: "#86868b", darksecondary: "#a1a1a6", border: "#e5e5e7", darkborder: "#2c2c2e" }
                    },
                    fontFamily: { sans: ["-apple-system", "BlinkMacSystemFont", "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", "sans-serif"] }
                }
            }
        };
    </script>
    <link rel="stylesheet" href="assets/css/site.css">
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body data-page="alumni" class="bg-apple-bg dark:bg-apple-darkbg text-apple-text dark:text-apple-darktext font-sans antialiased selection:bg-iatss selection:text-white flex flex-col min-h-screen transition-colors duration-300">
    <div id="site-header"></div>
    <div id="alumni-modal"></div>
    <main class="flex-grow">
        <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-10 sm:pt-14 pb-20">
<div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
                    <div class="glass-card rounded-3xl overflow-hidden apple-shadow-lg">
                        <div class="p-6 sm:p-8 border-b border-apple-border/60 dark:border-apple-darkborder/60">
                            <div class="flex flex-col lg:flex-row lg:items-end lg:justify-between gap-6">
                                <div>
                                    <div class="inline-flex items-center gap-2 text-[10px] font-bold uppercase tracking-[0.2em] text-iatss mb-3">
                                        <span class="w-2 h-2 rounded-full bg-iatss"></span>
                                        Thai Alumni Network
                                    </div>

                                    <h2 class="text-3xl sm:text-4xl font-extrabold text-apple-text dark:text-apple-darktext">Connect by experience</h2>
                                    <p class="text-apple-secondary dark:text-apple-darksecondary mt-2 max-w-2xl">Explore the professional relationships and shared impact of IATSS Forum alumni across Thailand.</p>
                                </div>
                                <div class="flex flex-col sm:flex-row gap-3">
                                    <button id="btn-profession" onclick="setAlumniLayout('profession')" class="px-4 py-2.5 bg-iatss text-white rounded-full text-xs font-semibold transition shadow-sm hover:bg-iatss-hover">Profession network</button>
                                    <button id="btn-batch" onclick="setAlumniLayout('batch')" class="px-4 py-2.5 bg-apple-subtle dark:bg-apple-darksubtle text-apple-secondary dark:text-apple-darksecondary rounded-full text-xs font-semibold transition hover:text-iatss">Arrange by batch</button>
                                </div>
                            </div>
                        </div>
                        <div id="network-container" class="w-full h-[520px] sm:h-[600px] bg-apple-subtle/60 dark:bg-apple-darksubtle/60"></div>
                        <div class="px-6 py-4 border-t border-apple-border/60 dark:border-apple-darkborder/60 text-xs text-apple-secondary dark:text-apple-darksecondary">
                            Select a node to view alumni details. Use the controls above to change the network arrangement.
                        </div>
                    </div>
                </div>
        </section>
    </main>
    <div id="site-footer"></div>
    <div id="page-popup"></div>
    <script src="assets/js/site-shell.js"></script>
    <script src="assets/js/site.js"></script>
</body>
</html>
